# Python checks: run on every push and pull request.
# Installs the exact locked environment, then lints, tests and runs the pipeline.
name: Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # Uses the committed raw snapshot, so this does not download anything.
      - name: Run pipeline
        run: uv run python -m manager_tenure.dataset
