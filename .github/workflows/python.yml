# Python checks: run on every push and pull request.
# Installs the exact locked environment, then lints, tests and runs the pipeline.
name: Python

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Builds every output from the committed raw files. Nothing is downloaded,
      # because each download step skips files that already exist.
      - name: Run pipeline
        run: make data

      # Runs after the pipeline, so the tests can check the real outputs.
      - name: Test
        run: uv run pytest
