[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "manager_tenure"
version = "0.0.1"
description = "How long do Premier League managers last? A reproducible pipeline and interactive React + D3 chart."
authors = [
  { name = "Jake Tufts" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "loguru",
    "lxml>=6.1.3",
    "matplotlib",
    "numpy",
    "pandas",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "python-dotenv",
    "requests>=2.34.2",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["manager_tenure", "tests"]
include = ["pyproject.toml", "manager_tenure/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["manager_tenure"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "ipython>=9.18.1",
    "jupyterlab>=4.6.6",
    "mkdocs>=1.6.1",
    "notebook>=7.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
